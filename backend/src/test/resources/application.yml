spring:
  datasource:
    url: jdbc:h2:mem:fashionfitai;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

fashionfitai:
  jwt:
    secret: test-secret-key-for-junit-tests-only-not-for-production-use
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
