spring:
  application:
    name: fashion-fit-ai-backend

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-square-pond-a11msn1f-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:neondb_owner}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:npg_gIcO8rtJ3qSx}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

fashionfitai:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-string-before-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.fashionfitai: DEBUG